[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nao-fair-server"
version = "0.1.0"
description = "Operator backend for one NAO robot at a university fair."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2",
    "python-dotenv>=1",
    "pytz>=2024.1",
    "uvicorn>=0.32",
    "websockets>=13",
]

[project.optional-dependencies]
browser = [
    "pipecat-ai[gladia]>=1.7.0,<1.8",
    "rich>=13",
]
robot = [
    "naoqi-control>=0.1.0",
    "nao-websocket-bridge-client>=0.1.0",
    "nao-websocket-bridge-protocol>=1.0.0",
    "pipecat-ai[gladia]>=1.7.0,<1.8",
    "rich>=13",
    "websockets>=13",
]
dev = ["pytest>=8"]

[project.scripts]
nao-fair = "nao_fair.main:main"

[tool.hatch.build.targets.wheel]
packages = ["nao_fair"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
