name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: mkdir -p -m 700 .venv/nltk_data && uv run --no-sync python -m nltk.downloader -d .venv/nltk_data punkt_tab
      - run: uv run --no-sync pytest -q
  windows-api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Check API imports without robot libraries
        run: uv run --no-sync python -c "from nao_fair.app import create_app; print('API imports OK')"
